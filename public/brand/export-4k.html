<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AYDARA — 4K 2D Transparent Asset Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1A0B22;
      color: #FFFFFF;
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: #C8A96B;
    }
    .preview-box {
      margin: 30px auto;
      padding: 30px;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    .btn-download {
      background: #C8A96B;
      color: #24112F;
      border: none;
      padding: 14px 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      margin: 10px;
      border-radius: 4px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .btn-download:hover {
      background: #DFCA99;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <h1>AYDARA</h1>
  <p>Official 4K Resolution &amp; 2D Transparent Background Brand Assets</p>

  <div class="preview-box">
    <img src="/brand/aydara-logo-gold.svg" alt="AYDARA Logo" style="max-height: 120px; margin-bottom: 20px;">
    <div>
      <button class="btn-download" onclick="generateAndDownload('logo', 3840, 2160, 'aydara-logo-4k.png')">
        Download 4K Transparent Logo (3840 x 2160)
      </button>
      <button class="btn-download" onclick="generateAndDownload('favicon', 4096, 4096, 'aydara-favicon-4k.png')">
        Download 4K Transparent Favicon (4096 x 4096)
      </button>
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>

  <script>
    function generateAndDownload(type, width, height, filename) {
      const canvas = document.getElementById('renderCanvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = type === 'logo' ? '/brand/aydara-logo-gold.svg' : '/favicon.svg';

      img.onload = () => {
        ctx.drawImage(img, 0, 0, width, height);
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
    }
  </script>
</body>
</html>
